<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gimnasio Hapkido - Exámenes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header><h1>🥋 Gimnasio de Hapkido</h1></header>
    <div id="layout-nav"></div>

    <div class="contenido">
        <div id="mensaje-error" class="aviso"></div>

        <div class="tarjeta" id="tarjetaForm">
            <h2 id="tituloForm">Registrar derecho de examen</h2>
            <form id="formExamen">
                <input type="hidden" id="idExamen">

                <label>Alumno</label>
                <select id="idAlumno" required></select>

                <label>Cinturón al que aspira</label>
                <select id="cinturonNuevo">
                    <option>Amarillo</option><option>Naranja</option><option>Verde</option>
                    <option>Azul</option><option>Rojo</option><option>Negro</option>
                </select>

                <label>Monto del derecho de examen</label>
                <input type="number" id="monto" min="1" step="1000" required>

                <button type="submit" id="btnGuardar">Registrar pago de examen</button>
                <a href="#" class="btn-cancelar" id="btnCancelar" style="display:none;">Cancelar</a>
            </form>
        </div>

        <div class="tarjeta">
            <h2>Historial de exámenes</h2>
            <table>
                <thead><tr><th>Alumno</th><th>Cinturón nuevo</th><th>Fecha</th><th>Monto</th><th colspan="2"></th></tr></thead>
                <tbody id="tablaExamenes"></tbody>
            </table>
        </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/validar.js"></script>
    <script src="js/paginas/examenes.js"></script>
</body>
</html>
