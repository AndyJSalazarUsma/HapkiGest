<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gimnasio Hapkido - Inventario</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header><h1>🥋 Gimnasio de Hapkido</h1></header>
    <div id="layout-nav"></div>

    <div class="contenido">
        <div id="mensaje-error" class="aviso"></div>

        <div class="tarjeta" id="tarjetaForm">
            <h2 id="tituloForm">Agregar producto al inventario</h2>
            <form id="formProducto">
                <input type="hidden" id="idProducto">
                <label>Nombre</label>
                <input type="text" id="nombre" required minlength="2" maxlength="150">
                <label>Marca</label>
                <input type="text" id="marca" maxlength="60" placeholder="Ej: Daedo, Fuji, KimuRwear...">
                <label>Tipo</label>
                <select id="tipo"><option>Uniforme</option><option>Proteccion</option><option>Otro</option></select>
                <label id="labelCantidad">Cantidad inicial</label>
                <input type="number" id="cantidad" min="0" required>
                <label>Precio unitario</label>
                <input type="number" id="precio" min="1" step="1000" required>
                <button type="submit" id="btnGuardar">Guardar producto</button>
                <a href="#" class="btn-cancelar" id="btnCancelar" style="display:none;">Cancelar</a>
            </form>
        </div>

        <div class="tarjeta">
            <h2>Registrar venta</h2>
            <form id="formVenta">
                <label>Producto</label>
                <select id="idProductoVenta" required></select>
                <label>Alumno (opcional)</label>
                <select id="idAlumnoVenta"><option value="">-- Venta general --</option></select>
                <label>Cantidad vendida</label>
                <input type="number" id="cantidadVendida" min="1" required>
                <button type="submit">Registrar venta</button>
            </form>
        </div>

        <div class="tarjeta">
            <h2>Existencias actuales</h2>
            <table>
                <thead><tr><th>Producto</th><th>Marca</th><th>Tipo</th><th>Cantidad</th><th>Precio</th><th colspan="2"></th></tr></thead>
                <tbody id="tablaProductos"></tbody>
            </table>
        </div>
    </div>

    <script src="js/db.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/validar.js"></script>
    <script src="js/paginas/inventario.js"></script>
</body>
</html>
